name: boomerang-leaseweb

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shoplite
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplite -d shoplite"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: shoplite
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management listener [{port,15672},{ip,\"127.0.0.1\"}]"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://shoplite:${POSTGRES_PASSWORD}@postgres:5432/shoplite
      AMQP_URL: amqp://shoplite:${RABBITMQ_PASSWORD}@rabbitmq:5672/shoplite
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: ./app
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://shoplite:${POSTGRES_PASSWORD}@postgres:5432/shoplite
      AMQP_URL: amqp://shoplite:${RABBITMQ_PASSWORD}@rabbitmq:5672/shoplite
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: shoplite
      PGUSER: shoplite
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup:ro
      - postgres_backup:/backups
    command: sh -c "while true; do /backup/pg_backup.sh; sleep 86400; done"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
  postgres_backup:
