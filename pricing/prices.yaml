# Published list prices used by boomerang/cost.py (owner: D).
# Rule: no number without a source. Every line has the URL it was read from and the date.
# AWS: region eu-central-1 (Frankfurt), read from AWS's official Price List API files
#      (the marketing pages only show US East examples).
# Leaseweb: list prices excl. VAT as shown on leaseweb.com; the page does not state a
#      location for these prices (Public Cloud is offered in AMS-01, FRA-01, ...).
# Re-check before the demo; prices change.

fx:
  usd_to_eur: 0.9098            # 1 / 1.0992 USD per EUR
  source: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
  reference_date: 2026-11-19    # ECB euro foreign exchange reference rate
  retrieved: 2026-11-20

region:
  aws: eu-central-1 (Frankfurt)
  leaseweb: not stated on the price page (compare with FRA-01)

prices:
  # ---------------- Leaseweb ----------------
  - id: lw.instance.m3_large
    provider: leaseweb
    item: Public Cloud LSW.M3.LARGE (General Purpose, 2 vCPU, 7 GiB RAM, 5 GB root)
    unit: month
    price: 29.44
    currency: EUR
    source: https://www.leaseweb.com/en/products-services/cloud/public-cloud/pricing
    retrieved: 2026-11-20
  - id: lw.instance.m3_xlarge
    provider: leaseweb
    item: Public Cloud LSW.M3.XLARGE (General Purpose, 4 vCPU, 15 GiB RAM, 5 GB root)
    unit: month
    price: 59.33
    currency: EUR
    source: https://www.leaseweb.com/en/products-services/cloud/public-cloud/pricing
    retrieved: 2026-11-20
  - id: lw.instance.c3_xlarge
    provider: leaseweb
    item: Public Cloud LSW.C3.XLARGE (Compute Optimized, 4 vCPU, 7 GiB RAM, 5 GB root)
    unit: month
    price: 52.50
    currency: EUR
    source: https://www.leaseweb.com/en/products-services/cloud/public-cloud/pricing
