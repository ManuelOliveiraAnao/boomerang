  - id: lw.block_storage.gb_month
    provider: leaseweb
    item: Central Storage, Network SSD (up to 5K IOPS), first tier (1 GB)
    unit: GB-month
    price: 0.0800
    currency: EUR
    note: Volume tiers go down to 0.0720 at 700 GB; we use the first tier (conservative).
    source: https://www.leaseweb.com/en/products-services/cloud/public-cloud/pricing
    retrieved: 2026-11-20
  - id: lw.egress.gb
    provider: leaseweb
    item: Public Cloud outgoing traffic beyond the free tier (>1 TB tier)
    unit: GB
    price: 0.0022
    currency: EUR
    free_quantity: 1000         # "1 TB of free pooled Internet traffic per month"; incoming is free
    note: Cheaper tiers from 10 TB (0.0019/GB) and up; we use the first paid tier.
    source: https://www.leaseweb.com/en/products-services/cloud/public-cloud/pricing
    retrieved: 2026-11-20
  - id: lw.object_storage.gb_month
    provider: leaseweb
    item: Object Storage, On Demand, 0 GB - 50 TB
    unit: GB-month
    price: 0.01733
    currency: EUR
    source: https://www.leaseweb.com/en/products-services/object-storage
    retrieved: 2026-11-20
  - id: lw.object_storage.put_thousand
    provider: leaseweb
