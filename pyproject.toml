[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boomerang"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ollama", "anthropic>=1,<2", "pydantic>=2", "typer", "rich", "python-dotenv", "jinja2", "pyyaml",
  "boto3", "psycopg[binary]>=3", "pika", "fastapi", "uvicorn", "httpx", "pytest", "streamlit",
  "moto[server]",
]

[project.optional-dependencies]
dev = []

[project.scripts]
boomerang = "boomerang.cli:app"

[tool.setuptools.packages.find]
include = ["boomerang*", "sovereign_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "runs"]
